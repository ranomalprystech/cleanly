<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <!-- Calendar Outer Frame -->
  <rect x="15" y="20" width="70" height="65" rx="2" stroke="#48C3D3" stroke-width="5" fill="none" />
  
  <!-- Horizontal Header Line -->
  <line x1="15" y1="36" x2="85" y2="36" stroke="#48C3D3" stroke-width="5" />
  
  <!-- Calendar Binder Dots/Rings -->
  <rect x="30" y="26" width="5" height="5" fill="#48C3D3" />
  <rect x="65" y="26" width="5" height="5" fill="#48C3D3" />
  
  <!-- "15" Date Text -->
  <text x="50" y="68" font-family="Arial, sans-serif" font-size="30" font-weight="normal" fill="#48C3D3" text-anchor="middle">15</text>
</svg>
